<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1110"><title>Simulasi Proses Penggunaan Ulang Air</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="app.css"><style>
.tour-hero{display:grid;grid-template-columns:1.15fr .85fr;gap:14px}.tour-scene{min-height:300px;position:relative;overflow:hidden;border:1px solid #2a3b30;border-radius:13px;background:radial-gradient(ellipse at 50% 95%,#1d3c2a,#101713 72%);display:grid;place-items:center}.tour-scene:before{content:'';position:absolute;inset:0;background-image:linear-gradient(#39503a24 1px,transparent 1px),linear-gradient(90deg,#39503a24 1px,transparent 1px);background-size:28px 28px;transform:perspective(350px) rotateX(52deg) scale(1.45);transform-origin:bottom}.machine{z-index:1;position:relative;width:140px;height:170px;display:grid;place-items:center;filter:drop-shadow(0 12px 17px #0008);transition:.35s}.tank{height:115px;width:75px;border:1px solid #9caf9f;border-radius:15px 15px 12px 12px;background:linear-gradient(90deg,#1e3025,#82968a 20%,#334b3a 46%,#1b2c22 82%);position:relative;box-shadow:inset -12px 0 15px #0b120e,7px 7px 0 #0b120c;transform:perspective(320px) rotateY(-16deg)}.tank:before{content:'';position:absolute;top:-9px;left:-1px;right:-1px;height:19px;border:1px solid #a0b5a6;border-radius:50%;background:linear-gradient(90deg,#324a39,#b1c0b3,#405843)}.tank:after{content:'';position:absolute;left:8px;right:8px;bottom:20px;height:5px;border-radius:4px;background:#9be875;box-shadow:0 0 13px #9be875}.machine.uf .tank{width:116px;height:82px;border-radius:7px;background:linear-gradient(90deg,#24362a,#89998c,#2b4130)}.machine.ro .tank{width:46px;height:135px}.machine.blend .tank{width:105px;height:105px;border-radius:18px}.machine.pump .tank{width:86px;height:75px;border-radius:45%;}.gauge{position:absolute;right:13px;top:32px;width:25px;height:25px;border:3px solid #88a191;border-radius:50%;background:#14231a;z-index:2}.machine-label{position:absolute;bottom:16px;z-index:2;color:#b6c7ba;font:9px 'DM Mono';letter-spacing:.1em}.flow{position:absolute;left:8%;right:8%;top:62%;height:4px;border-radius:4px;background:linear-gradient(90deg,#42654a,#a0da7a,#42654a);box-shadow:0 0 10px #9be87555}.flow-dot{position:absolute;top:-5px;left:0;width:13px;height:13px;border-radius:50%;background:#c2fb8d;box-shadow:0 0 15px 6px #9be8758c;animation:move 4s linear infinite}.tour-scene.paused .flow-dot{animation-play-state:paused}@keyframes move{to{left:calc(100% - 13px)}}.brine-tag{position:absolute;bottom:46px;right:15px;padding:7px 9px;border:1px dashed #b7985a;border-radius:7px;background:#292516;color:#ebd69b;font:8px 'DM Mono';z-index:2}.tour-controls{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.tour-btn{border:1px solid #2a392f;background:#17211a;border-radius:7px;color:#c0cdc2;padding:9px 12px;font-size:10px}.tour-btn.primary{background:#9be875;color:#122017;border-color:#9be875;font-weight:700}.tour-layout{display:grid;grid-template-columns:1.15fr .85fr;gap:14px}.timeline{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:14px;overflow:visible}.timeline button{display:flex;align-items:flex-start;min-width:0;min-height:58px;border:1px solid #304238;background:#131d17;color:#b9c8bd;border-radius:9px;padding:11px 12px;font-size:11px;line-height:1.45;text-align:left;white-space:normal;overflow-wrap:anywhere;transition:background .2s,border-color .2s,color .2s}.timeline button:hover{border-color:#598365;background:#19271e;color:#edf7ee}.timeline button.active{border-color:#9be875;background:#1d3021;color:#dff3cf}.timeline button.done{border-color:#34704e;color:#7fe0a6}.caption{font-size:13px;line-height:1.75;color:#c7d5c9}.caption strong{color:#eff6ed}.progress{height:4px;background:#27352b;border-radius:4px;overflow:hidden;margin:13px 0}.progress i{display:block;height:100%;background:linear-gradient(90deg,#47d6a1,#9be875);transition:width .35s}.source{font-size:10px;line-height:1.65;color:#84948a}@media(max-width:900px){.tour-hero,.tour-layout{grid-template-columns:1fr}}@media(min-width:1200px){.timeline{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(max-width:700px){.tour-scene{min-height:240px;overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y;scrollbar-width:thin;scrollbar-color:#598365 #17221b}.tour-scene:after{content:"Geser diagram ke samping untuk melihat tahap 4?7 ?";display:block;position:sticky;left:10px;width:max-content;max-width:calc(100% - 20px);margin:0 10px 4px;padding:6px 9px;border:1px solid #38503f;border-radius:7px;background:#101713;color:#b9d69f;font:10px 'DM Sans',sans-serif}}@media(max-width:390px){.timeline{grid-template-columns:1fr}}
